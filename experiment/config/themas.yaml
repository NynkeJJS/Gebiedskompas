      weights:
        "Percentage Water": 0.15
        "Gemiddelde hoogste grondwaterstand (meter onder maaiveld)": 0.15
        "Grondwaterstand extreem nat jaar (meter onder maaiveld)": 0.15
        "Grondwaterstand extreem droog jaar (meter onder maaiveld)": 0.10
        "Risico paalrot Huidig": 0.15
        "Risico paalrot 2050 Hoog": 0.15
        "Maximale overstromingsdiepte 50 tot 200cm met een extreem kleine kans": 0.15


