
Woningmarkt_Eigendom:
  description: Eigendomssituatie en woningtypes
  variables:
    - "Koopwoningen (%)"
    - "Huurwoningen totaal (%)"
    - "In bezit woningcorporatie (%)"
    - "In bezit overige verhuurders (%)"
    - "Percentage eengezinswoning (%)"
    - "Percentage meergezinswoning (%)"
    - "Percentage vrijstaande woning (eengezins (%)"
  runs:
    entropy: {}
    weighted_mean:
      weights:
        "Koopwoningen (%)": 0.20
        "Huurwoningen totaal (%)": 0.20
        "In bezit woningcorporatie (%)": 0.20
        "In bezit overige verhuurders (%)": 0.10
        "Percentage eengezinswoning (%)": 0.15
        "Percentage meergezinswoning (%)": 0.10
        "Percentage vrijstaande woning (eengezins (%)": 0.05


Welvaart_Kwetsbaarheid:
  description: Sociaal-economische positie en financiële kwetsbaarheid
  variables:
    - "Gemiddelde WOZ-waarde"
    - "Gemiddelde WOZ-waarde van woningen (x 1 000 euro)"
    - "Personenauto's per huishouden (per huishouden)"
    - "Percentage moeite met rondkomen"
    - "Percentage sociaal minimum huishoudens"
  runs:
    entropy: {}
    weighted_mean:
      weights:
        "Gemiddelde WOZ-waarde": 0.25
        "Gemiddelde WOZ-waarde van woningen (x 1 000 euro)": 0.15
        "Personenauto's per huishouden (per huishouden)": 0.15
        "Percentage moeite met rondkomen": 0.25
        "Percentage sociaal minimum huishoudens": 0.20


